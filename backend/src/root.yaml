openapi: 3.0.3
info:
  title: Vacation Management API
  version: 1.0.0
paths:
  /auth/login:
    post:
      x-handler: modules/auth/auth.handlers#login
      x-inputParser: modules/auth/auth.handlers#parseLogin
      summary: Log in with email and password, returns a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Token and user
        '400':
          description: Missing email or password
        '401':
          description: Invalid email or password

  /auth/me:
    get:
      x-handler: modules/auth/auth.handlers#getMe
      x-inputParser: modules/auth/auth.handlers#parseMe
      summary: Returns the logged-in user from the token
      responses:
        '200':
          description: Current user
        '401':
          description: Missing or invalid token

  /vacation-requests:
    post:
      x-handler: modules/vacation-requests/vacation-request.handlers#createRequest
      x-inputParser: modules/vacation-requests/vacation-request.handlers#parseCreate
      summary: Requester submits a vacation request (starts as Pending)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startDate, endDate]
              properties:
                startDate:
                  type: string
                  example: '2026-12-20'
                endDate:
                  type: string
                  example: '2026-12-24'
                reason:
                  type: string
      responses:
        '201':
          description: The created request
        '400':
          description: Invalid input, end before start, or start in the past
        '401':
          description: Missing or invalid token
        '403':
          description: Not a Requester
        '409':
          description: Overlaps another of your requests

    get:
      x-handler: modules/vacation-requests/vacation-request.validator.handlers#listAll
      x-inputParser: modules/vacation-requests/vacation-request.validator.handlers#parseListAll
      summary: Validator lists everyone's requests, with filters and pagination
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [Pending, Approved, Rejected]
        - in: query
          name: userId
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        '200':
          description: "{ items, total, page, limit }, each item includes the requester"
        '400':
          description: Invalid filter, page or limit
        '401':
          description: Missing or invalid token
        '403':
          description: Not a Validator

  /vacation-requests/mine:
    get:
      x-handler: modules/vacation-requests/vacation-request.handlers#listMine
      x-inputParser: modules/vacation-requests/vacation-request.handlers#parseListMine
      summary: Requester lists their own requests, newest first
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        '200':
          description: "{ items, total, page, limit }"
        '400':
          description: Invalid page or limit
        '401':
          description: Missing or invalid token
        '403':
          description: Not a Requester

  /vacation-requests/:id/approve:
    patch:
      x-handler: modules/vacation-requests/vacation-request.validator.handlers#approve
      x-inputParser: modules/vacation-requests/vacation-request.validator.handlers#parseApprove
      summary: Validator approves a Pending request
      responses:
        '200':
          description: The approved request
        '400':
          description: Invalid id
        '401':
          description: Missing or invalid token
        '403':
          description: Not a Validator
        '404':
          description: Request not found
        '409':
          description: Request is not Pending

  /vacation-requests/:id/reject:
    patch:
      x-handler: modules/vacation-requests/vacation-request.validator.handlers#reject
      x-inputParser: modules/vacation-requests/vacation-request.validator.handlers#parseReject
      summary: Validator rejects a Pending request with a comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment:
                  type: string
      responses:
        '200':
          description: The rejected request
        '400':
          description: Invalid id, or empty comment
        '401':
          description: Missing or invalid token
        '403':
          description: Not a Validator
        '404':
          description: Request not found
        '409':
          description: Request is not Pending

  /team/vacations:
    get:
      x-handler: modules/team/team.handlers#teamVacations
      x-inputParser: modules/team/team.handlers#parseTeamVacations
      summary: Team vacation plan, the approved vacations of everyone, soonest first
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        '200':
          description: "{ items: [{ id, userId, userName, startDate, endDate }], total, page, limit }"
        '400':
          description: Invalid page or limit
        '401':
          description: Missing or invalid token

  /users:
    get:
      x-handler: modules/users/user.handlers#listUsers
      x-inputParser: modules/users/user.handlers#parseListUsers
      summary: Validator lists the Requesters (id and name) for the dashboard dropdown
      responses:
        '200':
          description: "{ items: [{ id, name }] }, sorted by name"
        '401':
          description: Missing or invalid token
        '403':
          description: Not a Validator
